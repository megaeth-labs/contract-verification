[package]
name = "contract-verification"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "verify-contract"
path = "src/main.rs"

[dependencies]
alloy = { version = "1.5.2", features = ["full"] }
clap = { version = "4.5.56", features = ["derive", "env"] }
eyre = "0.6"
foundry-compilers = { version = "0.19", features = ["svm-solc"] }
foundry-compilers-artifacts-solc = "0.19"
semver = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
